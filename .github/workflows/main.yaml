name: Build and Release
permissions:
  contents: write
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: auto
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Build and Test on Default Platform
      run: |
        set -euo pipefail
        go build -v ./...
        go test -v ./...
    - name: Preserve the last published assets until new binaries are built
      run: |
        echo "Existing release assets are retained until each validated replacement is uploaded."
    env:
      GOPROXY: https://proxy.golang.org|direct
  release-binary:
    name: Release Go Binary
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/UnlockTests/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/UnlockTests/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Install UPX
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y upx-ucl || sudo apt-get install -y upx || true
    - name: Build and Release
      env:
        GOARM_VALUE: ${{ matrix.goarm }}
      run: |
        set -euo pipefail
        mkdir -p bin
        cd cmd
        if [ -n "${GOARM_VALUE}" ]; then
          export GOARM="${GOARM_VALUE}"
        fi
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
          -o ../bin/ut-${{ matrix.goos }}-${{ matrix.goarch }} \
          -v \
          -ldflags="-extldflags=-static -s -w" \
          -trimpath \
          .
        if command -v upx >/dev/null 2>&1; then
          upx --best ../bin/ut-${{ matrix.goos }}-${{ matrix.goarch }} || echo "UPX skipped for ut-${{ matrix.goos }}-${{ matrix.goarch }}"
        else
          echo "UPX not available, skipping compression"
        fi
    - name: Upload New Assets
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        shopt -s nullglob
        files=(./bin/*)
        [[ ${#files[@]} -gt 0 ]] || { echo "No release binaries were built." >&2; exit 1; }
        gh release view output --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create output --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title output --notes "Validated component binaries"
        for file in "${files[@]}"; do
          [[ -f "$file" && -s "$file" ]] || { echo "Invalid release binary." >&2; exit 1; }
        done
        python3 "$RUNNER_TEMP/ci-release-assets.py" output "${files[@]}"
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
    strategy:
      matrix:
        goos:
        - windows
        - freebsd
        - openbsd
        - linux
        - darwin
        goarch:
        - amd64
        - 386
        exclude:
        - goarch: 386
          goos: darwin
        include:
        - goos: windows
          goarch: 386
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: arm64
        - goos: darwin
          goarch: arm64
        - goos: linux
          goarch: arm
          goarm: 7
        - goos: linux
          goarch: arm64
        - goos: linux
          goarch: riscv64
        - goos: linux
          goarch: mips64
        - goos: linux
          goarch: mips64le
        - goos: linux
          goarch: mipsle
        - goos: linux
          goarch: mips
        - goos: linux
          goarch: ppc64
        - goos: linux
          goarch: ppc64le
        - goos: linux
          goarch: s390x
        - goos: freebsd
          goarch: arm64
        - goos: freebsd
          goarch: arm
          goarm: 7
        - goos: openbsd
          goarch: arm64
        - goos: openbsd
          goarch: arm
          goarm: 7
    env:
      GOPROXY: https://proxy.golang.org|direct
    concurrency:
      group: release-assets-${{ github.repository }}-${{ matrix.goos }}-${{ matrix.goarch }}
      cancel-in-progress: false
'on':
  workflow_dispatch: null
